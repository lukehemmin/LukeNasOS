# PR gate. x86_64 gates everything: if this is red, nothing merges.
#
# A copy of this file lives on main so that manual dispatch is registered
# (GitHub only lists workflow_dispatch workflows found on the default
# branch); push runs are driven by THIS copy on the development branch.
name: 260709_test_e2e

on:
  pull_request:
  push:
    branches: [260709_test]
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static checks (syntax, shellcheck, credential grep)
        run: scripts/demo-lifecycle.sh verify-static

  iso:
    # The installer ISO as a downloadable run artifact (Actions run page →
    # Artifacts, or `gh run download -n lukenasos-x86_64-iso`). Same script
    # as local `make iso`. Online installer: installing from it needs the
    # OS image published at the ref baked into the kickstart.
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Install remaster tools
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools
      - name: Which Fedora do we build against? (scripts/build-iso.sh decides)
        id: netinst
        run: echo "key=$(scripts/build-iso.sh --print-netinst-key)" >> "$GITHUB_OUTPUT"
      - name: Cache the netinst ISO
        uses: actions/cache@v4
        with:
          path: build/fedora-netinst-${{ steps.netinst.outputs.key }}.iso
          key: fedora-netinst-${{ steps.netinst.outputs.key }}
      - name: Build the installer ISO
        run: scripts/build-iso.sh
      - name: Upload as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: lukenasos-x86_64-iso
          path: build/lukenasos-x86_64.iso
          retention-days: 14
          compression-level: 0   # ISO is already compressed; do not burn CPU

  nightly:
    # Run artifacts require a GitHub login to download; a release does not.
    # Publish the ISO under a fixed `nightly` prerelease so anyone can fetch
    # the latest development build from a stable URL:
    #   https://github.com/lukehemmin/LukeNasOS/releases/download/nightly/lukenasos-x86_64.iso
    # The tag is recreated on every push so the release date and commit always
    # match what the ISO was built from. Formal releases stay on release.yml
    # (v* tags); this never touches them.
    #
    # Caveat: the ISO is an online installer — installing from it still needs
    # the OS image published at the ref baked into the kickstart.
    runs-on: ubuntu-latest
    needs: iso
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the ISO built in this run
        uses: actions/download-artifact@v4
        with:
          name: lukenasos-x86_64-iso
          path: build
      - name: Refresh the nightly prerelease
        run: |
          # Delete-and-recreate instead of --clobber: moving the tag keeps the
          # release pointing at the commit the ISO actually came from.
          gh release delete nightly --yes || true
          git push origin :refs/tags/nightly || true
          gh release create nightly build/lukenasos-x86_64.iso \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build (${GITHUB_SHA::7})" \
            --notes "Automated development build of \`${{ github.ref_name }}\` at ${{ github.sha }}.

          Not a release: untested beyond the CI gate, may not install without a published OS image. For stable builds use the versioned releases."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: podman build -t lukenasos:ci .
      - name: Image must not exceed the size budget
        run: |
          size=$(podman image inspect lukenasos:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt $((4 * 1024 * 1024 * 1024))
      - name: The firewall policy parses, as shipped
        # nftables.service loads this on every boot; a typo means a machine
        # that comes up with no filter at all, which is the hole the policy
        # exists to close. Checked here rather than in `static` because
        # `nft -c` is not a parser — it talks to the kernel, so it needs
        # CAP_NET_ADMIN and it needs to read the file from inside the image.
        #
        # Checked through /etc/sysconfig/nftables.conf, which is the path
        # nftables.service passes to `nft -f`, rather than through the policy
        # file directly: the conf is where the includes live, and an include
        # that cannot resolve fails the whole load — leaving the machine with
        # no firewall for a reason the policy file alone would never show.
        run: |
          podman run --rm --cap-add NET_ADMIN --entrypoint sh lukenasos:ci -c \
            'nft -c -f /etc/sysconfig/nftables.conf && echo "policy parses, as loaded"'
      - name: SMB opens for a share, and only through the policy
        # `luke setup share` opens 445 by dropping a rule file into a directory
        # the conf globs in (SPEC §9). Two ways that goes wrong and neither is
        # visible without the kernel: a wildcard include matching nothing could
        # error, and every fresh install would boot with no firewall; or the
        # rule could fail to resolve against the table the first include
        # defines, and the first share would open nothing.
        run: |
          podman run --rm --cap-add NET_ADMIN --entrypoint sh lukenasos:ci -c '
            set -e
            nft -c -f /etc/sysconfig/nftables.conf
            echo "empty glob: fresh installs still load a policy"
            mkdir -p /etc/lukenasos/nftables.d
            printf "add rule inet lukenasos input tcp dport 445 accept\n" \
              > /etc/lukenasos/nftables.d/10-shares.nft
            nft -c -f /etc/sysconfig/nftables.conf
            echo "share rule: resolves against the table the policy defines"
          '
      - name: greenboot's boot_counter snippet reaches bootupd's configs.d
        # The 42 → 44 bump nearly disarmed the headline feature in silence.
        #
        # greenboot's grub snippet is what decrements boot_counter, and without
        # it a broken update simply keeps booting: no rollback, no error, a
        # green banner. greenboot 0.16 moved that snippet out of /etc/grub.d/
        # and renamed it (greenboot.cfg → 08_greenboot.cfg), and F42 only ever
        # had it in bootupd's configs.d because an RPM scriptlet copied it
        # there. Both facts are upstream's to change again.
        #
        # So this asserts the mechanism, not the version: whatever the base is,
        # the image must carry a grub snippet that touches boot_counter, in the
        # directory bootupd assembles the installed grub.cfg from. The lifecycle
        # job proves the rollback actually happens; this says WHY it stopped, in
        # seconds, on the PR that did it.
        run: |
          snippet=$(podman run --rm --entrypoint sh lukenasos:ci -c \
            'grep -rl boot_counter /usr/lib/bootupd/grub2-static/configs.d/ 2>/dev/null | head -1')
          if [ -z "$snippet" ]; then
            echo "::error::No grub snippet in bootupd's configs.d touches boot_counter." >&2
            echo "Automatic rollback would silently never happen. greenboot changed" >&2
            echo "where it ships its grub integration — find the new path before merging." >&2
            podman run --rm --entrypoint sh lukenasos:ci -c \
              'echo "configs.d holds:"; ls /usr/lib/bootupd/grub2-static/configs.d/; rpm -q greenboot' >&2
            exit 1
          fi
          echo "boot_counter snippet: $snippet"
          podman run --rm --entrypoint sh lukenasos:ci -c \
            "grep -E 'decrement boot_counter|set default=1' '$snippet'"
      - name: The greenboot units we enable are the ones greenboot ships
        # `systemctl enable` fails on a missing unit, so the build above already
        # catches a rename. This says it in one line instead of a wall of dnf.
        run: |
          podman run --rm --entrypoint sh lukenasos:ci -c '
            set -e
            for u in greenboot-healthcheck.service greenboot-set-rollback-trigger.service greenboot-success.target; do
              test "$(systemctl is-enabled $u)" = enabled || { echo "$u is not enabled"; exit 1; }
            done
            echo "greenboot units enabled: $(rpm -q greenboot)"'

  lifecycle:
    # The full VM lifecycle: install → update → break → auto-rollback →
    # factory reset. Runs against a local registry (v1/v2/v2-broken) —
    # never GHCR, so unpublished commits are testable and signature
    # rejection is reproducible.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + tools
        run: |
          sudo apt-get update
          # smbclient: phase 1c and phase 5 open the share from HERE, off the
          # guest, through a forwarded port — the only vantage point where the
          # 445 rule exists. A client inside the VM matches `iif lo accept` and
          # would prove the firewall works by never meeting it.
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools jq podman xorriso smbclient
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Which Fedora do we build against? (scripts/build-iso.sh decides)
        id: netinst
        run: echo "key=$(scripts/build-iso.sh --print-netinst-key)" >> "$GITHUB_OUTPUT"
      - name: Cache the netinst ISO
        uses: actions/cache@v4
        with:
          path: build/fedora-netinst-${{ steps.netinst.outputs.key }}.iso
          key: fedora-netinst-${{ steps.netinst.outputs.key }}
      - name: Download netinst ISO if not cached
        run: scripts/build-iso.sh --fetch-only
      - name: Run the full lifecycle
        timeout-minutes: 120
        run: scripts/demo-lifecycle.sh all

  grubenv-contract:
    # The one partition decision that is not negotiable, asserted forever:
    # /boot must be ext4 because GRUB cannot write grubenv on btrfs and
    # greenboot's rollback counter lives there.
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Kickstart keeps /boot on ext4
        run: |
          grep -Eq 'part /boot .*--fstype=ext4' installer/luke.ks
          grep -Eq 'mkfs\.ext4 .*lukenasos-boot' scripts/install-disk.sh

  install-contract:
    # Four things a real boot taught us in one afternoon. Each is one line in
    # the kickstart and each was invisible until someone watched a screen, so
    # each gets an assertion that outlives the person who remembers why.
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: BIOS machines can install (the biosboot partition)
        # Without it: "Installation Destination (Kickstart insufficient)",
        # forever, on a machine nobody is watching.
        run: grep -Eq '^part biosboot .*--fstype=biosboot' installer/luke.ks
      - name: Exactly one disk is erased
        # clearpart --all is only safe because %pre scopes it with
        # ignoredisk --only-use. If the %include ever goes, "all" means all.
        run: |
          grep -q '^%include /tmp/luke-disk.ks' installer/luke.ks
          grep -q 'ignoredisk --only-use=' installer/luke.ks
      - name: No well-known password ships
        # A password every install shares is not a secret; it makes ownership
        # a race that the first stranger on the LAN wins.
        run: |
          if grep -Eq 'password=(lukenasos|luke)\b|--password=[^ ]*--plaintext' installer/luke.ks; then
            echo "installer/luke.ks ships a well-known password (SPEC §10)" >&2
            exit 1
          fi
          grep -q 'chage -d 0 luke' installer/luke.ks
          grep -q 'setup-token' installer/luke.ks
      - name: The banner is the home screen, not dmesg
        run: grep -Eq '^bootloader --append=.*quiet' installer/luke.ks

  multidisk-guard:
    # The bug this repo would have shipped: two disks, and `clearpart --all`
    # takes both. tests/pre-disk.sh proves the decision tree against a stub
    # lsblk; this proves the real installer, with real lsblk, asks first and
    # writes nothing while it waits.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf mtools dosfstools jq podman xorriso
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Which Fedora do we build against? (scripts/build-iso.sh decides)
        id: netinst
        run: echo "key=$(scripts/build-iso.sh --print-netinst-key)" >> "$GITHUB_OUTPUT"
      - name: Cache the netinst ISO
        uses: actions/cache@v4
        with:
          path: build/fedora-netinst-${{ steps.netinst.outputs.key }}.iso
          key: fedora-netinst-${{ steps.netinst.outputs.key }}
      - name: Download netinst ISO if not cached
        run: scripts/build-iso.sh --fetch-only
      - name: Two disks, no target given — ask, do not erase
        timeout-minutes: 20
        run: scripts/demo-lifecycle.sh multidisk-guard
      - name: Keep the serial log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multidisk-serial-log
          path: build/multidisk-serial.log

  bios-install:
    # The screenshot that started this: a BIOS machine stalling at the
    # partitioning screen because the kickstart had no biosboot partition. The
    # install-contract job asserts the line exists; only a BIOS install proves
    # it works. Install only — the full lifecycle already runs on UEFI.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils mtools dosfstools jq podman xorriso
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Which Fedora do we build against? (scripts/build-iso.sh decides)
        id: netinst
        run: echo "key=$(scripts/build-iso.sh --print-netinst-key)" >> "$GITHUB_OUTPUT"
      - name: Cache the netinst ISO
        uses: actions/cache@v4
        with:
          path: build/fedora-netinst-${{ steps.netinst.outputs.key }}.iso
          key: fedora-netinst-${{ steps.netinst.outputs.key }}
      - name: Download netinst ISO if not cached
        run: scripts/build-iso.sh --fetch-only
      - name: Install on a BIOS machine (no OVMF)
        timeout-minutes: 90
        run: |
          scripts/demo-lifecycle.sh registry-up
          scripts/demo-lifecycle.sh build-variants
          FIRMWARE=bios scripts/demo-lifecycle.sh install
      - name: The installed disk carries a BIOS boot partition
        run: |
          sudo apt-get install -y gdisk
          sgdisk -p build/lukenasos-test.qcow2 2>/dev/null || true
          # qcow2 needs a raw view to read the partition table.
          qemu-img convert -f qcow2 -O raw build/lukenasos-test.qcow2 /tmp/installed.raw
          sgdisk -p /tmp/installed.raw | tee /tmp/parts.txt
          grep -q "EF02" /tmp/parts.txt || {
            echo "no BIOS boot partition on the installed disk — the BIOS stall is back" >&2
            exit 1
          }
