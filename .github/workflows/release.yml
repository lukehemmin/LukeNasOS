# Tag → build matrix → sign → smoke test → publish.
# x86_64 gates the release; ARM targets are separate artifacts on their own
# maturity timeline and never block it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/lukenasos

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
            gates_release: true
          - target: arm64-generic
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            gates_release: false
          # rpi4/rpi5 ship when the spike lands; they never gate.
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.gates_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build
        run: |
          podman build --platform ${{ matrix.platform }} \
            --build-arg VERSION=${{ github.ref_name }} \
            -t "$IMAGE:${{ github.ref_name }}-${{ matrix.target }}" .
      - name: Push
        run: podman push "$IMAGE:${{ github.ref_name }}-${{ matrix.target }}"
      - name: Sign (cosign, keyless — pinned to this workflow identity)
        # Two lessons from the first v0.1.0 attempt, both of which failed the
        # release AFTER the image was already pushed:
        # - The digest must come from the REGISTRY, not from podman's local
        #   RepoDigests: push recompresses layers, the local digest "succeeds"
        #   with a value the registry has never heard of, and cosign 404s on
        #   it (the old skopeo fallback never ran, because being wrong is not
        #   the same as failing).
        # - cosign's binary must match the runner: the hardcoded -amd64
        #   download came back exit 126 ("cannot execute") on the ARM runner.
        run: |
          case "$(uname -m)" in
            aarch64) coarch=arm64 ;;
            *)       coarch=amd64 ;;
          esac
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-${coarch}"
          chmod +x cosign
          # cosign is a standalone binary: it reads docker's config, not
          # podman's auth file, so the job's earlier `podman login` means
          # nothing to it — the signature blob upload came back UNAUTHORIZED
          # (attempt two's lesson). It logs in for itself.
          echo "${{ secrets.GITHUB_TOKEN }}" | ./cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:${{ github.ref_name }}-${{ matrix.target }}")
          ./cosign sign --yes "$IMAGE@$digest"

  smoke-and-publish:
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke — the published artifact is intact
        # The boot proof is not here and does not need to be: the ten-job e2e
        # gate ran on the exact commit this tag points at. What CAN go wrong
        # between that gate and a user's machine is the artifact itself, so
        # this pulls what was actually PUBLISHED and lints it. (The previous
        # version of this step installed QEMU, started a registry, pushed to
        # it — and then booted nothing: theater, which failed the release on
        # a TLS flag while asserting zero things.)
        run: |
          podman pull "$IMAGE:${{ github.ref_name }}-x86_64"
          podman run --rm "$IMAGE:${{ github.ref_name }}-x86_64" bootc container lint
          sudo apt-get update && sudo apt-get install -y xorriso mtools
      - name: Move the stable tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          skopeo copy "docker://$IMAGE:${{ github.ref_name }}-x86_64" "docker://$IMAGE:stable"
      - name: Build the installer ISO (same script as local `make iso`)
        run: |
          scripts/build-iso.sh \
            --image "$IMAGE:${{ github.ref_name }}-x86_64" \
            --out build/lukenasos-x86_64.iso
      - name: Publish the release with the ISO
        run: |
          # The previous release stays downloadable as the "-1" qcow2 so a
          # fresh adopter's `luke update` has something to find.
          gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" build/lukenasos-x86_64.iso --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
