name: Build ISO & RAUC

# ── 트리거 ──────────────────────────────────────────────
# • 모든 브랜치 푸시 → ISO + RAUC → "Nightly" pre-release 갱신
# • 모든 태그 푸시 → ISO + RAUC → 정식 GitHub Release
# • 모든 PR       → ISO 검증 빌드 (artifacts 없음)
# • 수동 실행     → ISO + RAUC → Nightly
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '버전 수동 지정 (예: 0.1.0.0) — 비우면 VERSION 파일 기반 자동 증가'
        required: false
        type: string

# 여러 커밋을 연속 푸시해도 최신 것만 실행
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release/Tag 조작을 위해 GITHUB_TOKEN 에 쓰기 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BUILDER_IMAGE: lukenasos-builder
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      REPO: ${{ github.repository }}

    steps:
      # ── 1. 디스크 확보 ──────────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          echo "=== After ==="
          df -h /

      # ── 2. 체크아웃 ─────────────────────────────────────
      #    fetch-tags: 나이틀리 빌드 번호(v{BASE}.N 태그) 계산에 전체 태그 필요
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      # ── 3. 빌드 모드·버전 판별 ───────────────────────────
      #    버전 체계 (나이틀리): {VERSION 파일의 BASE}.{빌드 번호}
      #      - 빌드마다 v{BASE}.N 태그를 커밋에 남기고, 다음 빌드는 최대 N+1
      #      - 개발자가 버전을 올리고 싶으면 VERSION 파일을 수정해 커밋
      #        (예: 0.0.0 → 0.1.0 이면 다음 나이틀리가 0.1.0.0 부터 다시 시작)
      #      - 수동 실행(workflow_dispatch)의 version 입력으로 일회성 강제 지정 가능
      #    개발자가 직접 푸시한 태그는 기존대로 정식 릴리즈.
      - name: Determine build context
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            # v 제거한 시맨틱 버전
            V="${{ github.ref_name }}"
            echo "version=${V#v}" >> "$GITHUB_OUTPUT"
            echo "🏷️  Mode: Release (${{ github.ref_name }})"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR 검증 빌드: 릴리즈를 만들지 않으므로 빌드 번호를 소비하지 않는다
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
            echo "tag_name=nightly" >> "$GITHUB_OUTPUT"
            echo "version=pr-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "🔍 Mode: PR validation (no release)"
          else
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
            echo "tag_name=nightly" >> "$GITHUB_OUTPUT"

            MANUAL="${{ github.event.inputs.version }}"
            if [ -n "$MANUAL" ]; then
              VER="$MANUAL"
              echo "✍️  Manual version override: $VER"
            else
              BASE=$(tr -d '[:space:]' < VERSION)
              if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::VERSION must be MAJOR.MINOR.PATCH (got: '$BASE')"
                exit 1
              fi
              LAST=$(git tag -l "v${BASE}.*" | sed -n "s/^v${BASE}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
              if [ -z "$LAST" ]; then NEXT=0; else NEXT=$((LAST + 1)); fi
              VER="${BASE}.${NEXT}"
            fi
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "build_tag=v$VER" >> "$GITHUB_OUTPUT"
            echo "🌙 Mode: Nightly ($VER)"
          fi

      # ── 4. RAUC 인증서 준비 ────────────────────────────
      - name: Setup RAUC certificates
        run: |
          mkdir -p certs

          if [ -n "$RAUC_KEY" ] && [ -n "$RAUC_CERT" ]; then
            echo "🔐 Using production RAUC keys from GitHub Secrets"
            printf '%s\n' "$RAUC_KEY" > certs/devel.key
            printf '%s\n' "$RAUC_CERT" > certs/devel.cert.pem
            chmod 600 certs/devel.key
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR 검증 빌드는 .raucb 를 게시하지 않으므로(아래 게시 단계는 모두
            # github.event_name != 'pull_request' 조건) 일회성 자체서명 키로 충분하다.
            echo "🔑 PR validation build: generating throwaway self-signed RAUC keys..."
            openssl req -newkey rsa:4096 -nodes -keyout certs/devel.key \
              -x509 -days 3650 -out certs/devel.cert.pem \
              -subj "/O=LukeNasOS/CN=LukeNasOS Development/"
          else
            # 게시 빌드(nightly/release)는 안정적인 서명 키가 필수다. 매 실행마다
            # 키를 회전하면 기기에 구워진 /etc/rauc/keyring.pem(이전 키)이 새 번들
            # 서명을 거부해 온라인 업데이트가 구조적으로 불가능해진다. → 명확히 실패.
            echo "::error::RAUC_KEY/RAUC_CERT secrets are required for publishing builds."
            echo "::error::Rotating signing keys per run makes devices installed from"
            echo "::error::earlier ISOs reject these update bundles (keyring mismatch)."
            echo "::error::Set RAUC_KEY and RAUC_CERT in the repository secrets."
            exit 1
          fi
        env:
          RAUC_KEY: ${{ secrets.RAUC_KEY }}
          RAUC_CERT: ${{ secrets.RAUC_CERT }}

      # ── 5. Docker 준비 ─────────────────────────────────
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # ── 6. 빌더 이미지 빌드 ─────────────────────────────
      - name: Build builder Docker image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t "$BUILDER_IMAGE" \
            iso_build/

      # ── 7. ISO 빌드 ─────────────────────────────────────
      - name: Build ISO (live-build)
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/project" \
            -e LUKENASOS_VERSION="${{ steps.meta.outputs.version }}" \
            "$BUILDER_IMAGE" \
            /project/iso_build/build_iso.sh

      # ── 8. 권한 복구 ────────────────────────────────────
      - name: Fix artifact permissions
        if: success()
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            iso_build/live-build-work/ \
            web_ui/frontend/node_modules/ 2>/dev/null || true

      # ── 9. ISO 파일 식별 ────────────────────────────────
      - name: Locate ISO artifact
        id: iso
        if: success()
        run: |
          ISO_PATH=$(find iso_build/live-build-work -maxdepth 1 -name "*.iso" -type f | head -1)
          if [ -z "$ISO_PATH" ]; then
            echo "::error::No .iso file found in live-build-work"
            exit 1
          fi
          echo "path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ISO_PATH")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$ISO_PATH" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "📀 ISO: $(basename "$ISO_PATH") ($(du -h "$ISO_PATH" | cut -f1))"

      # ── 10. RAUC 번들 생성 (PR 제외) ─────────────────────
      - name: Build RAUC update bundle
        id: rauc
        if: success() && github.event_name != 'pull_request'
        run: |
          echo "📦 Building RAUC bundle for version ${{ steps.meta.outputs.version }}"
          bash create_update_bundle.sh "${{ steps.meta.outputs.version }}"

          BUNDLE=$(find update_bundles -name "*.raucb" -type f | head -1)
          echo "path=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$BUNDLE")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$BUNDLE" | cut -f1)" >> "$GITHUB_OUTPUT"

      # ── 11. Nightly Release 갱신 (브랜치 푸시) ────────────
      #    기존 nightly 태그+릴리즈를 삭제하고 현재 커밋으로 새로 생성.
      - name: Refresh nightly release
        if: success() && steps.meta.outputs.mode == 'nightly' && github.event_name != 'pull_request'
        run: |
          echo "🔄 Refreshing nightly release..."

          # GITHUB_TOKEN 으로 git 인증 (태그 force-push 용)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          # 이전 nightly 릴리즈 + 태그 정리
          gh release delete nightly --yes --repo "$REPO" 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

          # 현재 커밋에 nightly 태그 생성
          git tag -f nightly
          git push origin nightly -f

          # 빌드 번호 영속화: 버전 태그(예: v0.0.0.12)를 커밋에 남긴다.
          # 다음 빌드는 같은 BASE 의 태그에서 최대 번호를 읽어 +1 한다.
          # (GITHUB_TOKEN 푸시는 워크플로를 재트리거하지 않으므로 루프 없음)
          if [ -n "${{ steps.meta.outputs.build_tag }}" ]; then
            git tag -f "${{ steps.meta.outputs.build_tag }}"
            git push origin "${{ steps.meta.outputs.build_tag }}" -f
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. GitHub Release 생성 ─────────────────────────
      #    Release 모드(tag): 정식 릴리즈
      #    Nightly 모드:     pre-release (nightly 태그)
      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.mode == 'release' && format('LukeNasOS {0}', github.ref_name) || format('Nightly Build ({0})', steps.meta.outputs.version) }}
          prerelease: ${{ steps.meta.outputs.mode == 'nightly' }}
          make_latest: ${{ steps.meta.outputs.mode == 'release' }}
          body: |
            ${{ steps.meta.outputs.mode == 'release' && format('## 🚀 LukeNasOS {0}', github.ref_name) || '## 🌙 Nightly Build' }}

            | File | Size |
            |------|------|
            | ${{ steps.iso.outputs.name }} | ${{ steps.iso.outputs.size }} |
            | ${{ steps.rauc.outputs.name }} | ${{ steps.rauc.outputs.size }} |

            **Version**: `${{ steps.meta.outputs.version }}`
            **Commit**: `${{ github.sha }}`
            **Branch**: `${{ github.ref_name }}`

            ### Installation
            1. Write the ISO to a USB drive and boot.
            2. Complete the setup wizard.
            3. For updates: upload the `.raucb` via **Dashboard → System Update**.

            ### Upgrade
            Use the `.raucb` bundle — A/B slot update with automatic rollback.
          files: |
            ${{ steps.iso.outputs.path }}
            ${{ steps.rauc.outputs.path }}
          generate_release_notes: ${{ steps.meta.outputs.mode == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. 빌드 요약 ──────────────────────────────────
      - name: Print build summary
        if: success()
        run: |
          MODE_ICON="${{ steps.meta.outputs.mode == 'release' && '🏷️' || '🌙' }}"
          MODE_LABEL="${{ steps.meta.outputs.mode == 'release' && 'Release' || 'Nightly' }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build completed successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "$MODE_ICON Mode:            $MODE_LABEL"
          echo "📀 ISO:             ${{ steps.iso.outputs.name }} (${{ steps.iso.outputs.size }})"
          if [ -n "${{ steps.rauc.outputs.name }}" ]; then
            echo "📦 RAUC bundle:     ${{ steps.rauc.outputs.name }} (${{ steps.rauc.outputs.size }})"
          fi
          echo "🔗 Trigger:         ${{ github.event_name }}"
          echo "🌿 Branch:          ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
