<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LukeNasOS 초기 설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .setup-card { width: 100%; max-width: 500px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card setup-card">
        <div class="card-body p-5">
            <h2 class="text-center mb-4">환영합니다!</h2>
            <p class="text-center text-muted mb-4">LukeNasOS 사용을 위해 관리자 계정을 생성해주세요.</p>
            
            <form id="setupForm" onsubmit="handleSetup(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">관리자 ID</label>
                    <input type="text" class="form-control" id="username" required placeholder="admin">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">비밀번호 확인</label>
                    <input type="password" class="form-control" id="confirm_password" required>
                </div>
                
                <hr class="my-4">
                
                <div class="mb-3">
                    <label for="hostname" class="form-label">NAS 이름 (Hostname)</label>
                    <input type="text" class="form-control" id="hostname" value="lukenas" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">설정 완료 및 시작</button>
            </form>
        </div>
    </div>

    <script>
        function handleSetup(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const hostname = document.getElementById('hostname').value;

            if (password !== confirmPassword) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            fetch('/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, hostname })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("설정이 완료되었습니다. 로그인 페이지로 이동합니다.");
                    window.location.href = '/login';
                } else {
                    alert("설정 실패: " + data.message);
                }
            })
            .catch(err => alert("오류 발생: " + err));
        }
    </script>
</body>
</html>
