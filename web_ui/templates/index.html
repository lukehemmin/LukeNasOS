<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LukeNasOS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .progress { height: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h1 class="h3">LukeNasOS 대시보드</h1>
            <span class="badge bg-primary" id="os-info">Loading...</span>
        </header>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">CPU 사용량</h5>
                        <div class="progress">
                            <div id="cpu-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">메모리 사용량</h5>
                        <div class="progress">
                            <div id="mem-bar" class="progress-bar bg-warning" role="progressbar" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">디스크 사용량 (/)</h5>
                        <div class="progress">
                            <div id="disk-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <p class="mt-2 small text-muted text-end"><span id="disk-text">Loading...</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('os-info').textContent = `${data.system} ${data.release}`;
                    
                    document.getElementById('cpu-bar').style.width = data.cpu_percent + '%';
                    document.getElementById('cpu-bar').textContent = data.cpu_percent + '%';
                    
                    document.getElementById('mem-bar').style.width = data.memory_percent + '%';
                    document.getElementById('mem-bar').textContent = data.memory_percent + '%';
                    
                    document.getElementById('disk-bar').style.width = data.disk_percent + '%';
                    document.getElementById('disk-bar').textContent = data.disk_percent + '%';
                    document.getElementById('disk-text').textContent = `${data.disk_free} 사용 가능 / 총 ${data.disk_total}`;
                })
                .catch(err => console.error('Error fetching status:', err));
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
