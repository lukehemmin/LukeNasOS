<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LukeNasOS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .progress { height: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <h1 class="h3 mb-0">LukeNasOS 대시보드</h1>
                <div class="text-muted small">
                    버전: <span id="os-version">{{ version }}</span> | 
                    현재 슬롯: <span id="active-slot" class="fw-bold">{{ update_status.active_slot }}</span>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-sm" onclick="document.getElementById('update-file').click()">
                    업데이트 파일 선택 (슬롯 <span id="inactive-slot">{{ update_status.inactive_slot }}</span>)
                </button>
                <input type="file" id="update-file" style="display: none;" accept=".img,.iso" onchange="uploadUpdate()">
                <span class="badge bg-primary align-self-center" id="os-info">Loading...</span>
            </div>
        </header>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">CPU 사용량</h5>
                        <div class="progress">
                            <div id="cpu-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">메모리 사용량</h5>
                        <div class="progress">
                            <div id="mem-bar" class="progress-bar bg-warning" role="progressbar" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">디스크 사용량 (/)</h5>
                        <div class="progress">
                            <div id="disk-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <p class="mt-2 small text-muted text-end"><span id="disk-text">Loading...</span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">시스템 보안 설정</h5>
                        <p class="text-muted small">터미널(SSH/Console) 접근을 위한 Root 비밀번호를 설정합니다.</p>
                        <div class="input-group mb-3">
                            <input type="password" id="root-password" class="form-control" placeholder="새로운 Root 비밀번호" aria-label="Root Password">
                            <button class="btn btn-warning" type="button" onclick="setRootPassword()">비밀번호 설정</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setRootPassword() {
            const pwInput = document.getElementById('root-password');
            const password = pwInput.value;
            
            if (!password) {
                alert("비밀번호를 입력해주세요.");
                return;
            }
            
            if (!confirm("정말로 Root 비밀번호를 변경하시겠습니까?")) {
                return;
            }

            fetch('/api/system/root-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    pwInput.value = '';
                }
            })
            .catch(err => {
                alert('비밀번호 변경 실패: ' + err);
            });
        }

        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('os-info').textContent = `${data.system} ${data.release}`;
                    
                    document.getElementById('cpu-bar').style.width = data.cpu_percent + '%';
                    document.getElementById('cpu-bar').textContent = data.cpu_percent + '%';
                    
                    document.getElementById('mem-bar').style.width = data.memory_percent + '%';
                    document.getElementById('mem-bar').textContent = data.memory_percent + '%';
                    
                    document.getElementById('disk-bar').style.width = data.disk_percent + '%';
                    document.getElementById('disk-bar').textContent = data.disk_percent + '%';
                    document.getElementById('disk-text').textContent = `${data.disk_free} 사용 가능 / 총 ${data.disk_total}`;
                })
                .catch(err => console.error('Error fetching status:', err));
        }

        function uploadUpdate() {
            const fileInput = document.getElementById('update-file');
            const file = fileInput.files[0];
            if (!file) return;

            if (!confirm(`'${file.name}' 파일로 시스템 업데이트를 시작하시겠습니까?\n경고: 업데이트 중에는 전원을 끄지 마세요.`)) {
                fileInput.value = '';
                return;
            }

            const formData = new FormData();
            formData.append('update_file', file);

            // 간단한 로딩 표시
            const btn = document.querySelector('button[onclick*="update-file"]');
            const originalText = btn.innerText;
            btn.innerText = '업로드 및 설치 중...';
            btn.disabled = true;

            fetch('/api/upload_update', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.status === 'success') {
                    location.reload();
                }
            })
            .catch(err => {
                alert('업데이트 업로드 실패: ' + err);
                console.error(err);
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
                fileInput.value = '';
            });
        }

        function checkForUpdates() {
            // (기존 온라인 업데이트 기능은 잠시 비활성화하거나 유지)
            if (confirm('시스템 업데이트를 확인하고 설치하시겠습니까?')) {
                // ...
            }
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
